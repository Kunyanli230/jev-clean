[project]
name = "idac"
version = "0.1.0"
description = "Decision-first, auditable data cleaning powered by Jev"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=3.0,<4",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "typer>=0.27,<1",
    "typesafe-sdk==0.7.1",
]

[project.scripts]
idac = "idac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idac"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
